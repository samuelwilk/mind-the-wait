# Production Docker Compose for Hetzner VPS

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - php
      - mercure
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  php:
    build:
      context: ..
      dockerfile: Dockerfile
      target: frankenphp_prod
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env.prod
    environment:
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: https://mind-the-wait.ca/.well-known/mercure
    depends_on:
      - redis
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  pyparser:
    build:
      context: ./pyparser
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  scheduler-high-freq:
    build:
      context: ..
      dockerfile: Dockerfile
      target: frankenphp_prod
    restart: unless-stopped
    command: php bin/console messenger:consume scheduler_score_tick scheduler_mercure_route_broadcast scheduler_arrival_logging -vv
    env_file:
      - .env.prod
    environment:
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: https://mind-the-wait.ca/.well-known/mercure
    depends_on:
      redis:
        condition: service_healthy
      mercure:
        condition: service_started
    networks:
      - app-network

  scheduler-low-freq:
    build:
      context: ..
      dockerfile: Dockerfile
      target: frankenphp_prod
    restart: unless-stopped
    command: php bin/console messenger:consume scheduler_weather_collection scheduler_performance_aggregation scheduler_insight_cache_warming scheduler_bunching_detection -vv
    env_file:
      - .env.prod
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network

  mercure:
    image: dunglas/mercure:v0.16
    restart: unless-stopped
    expose:
      - "80"
    env_file:
      - .env.prod
    environment:
      SERVER_NAME: ":80"
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        cors_origins https://mind-the-wait.ca
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/.well-known/mercure"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
  redis_data:

networks:
  app-network:
    driver: bridge
