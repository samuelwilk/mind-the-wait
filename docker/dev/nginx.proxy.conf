# Proxy-mode: Traefik handles TLS, nginx serves plain HTTP on port 80.
server {
    listen 80;
    server_name mind-the-wait.local localhost;

    root /var/www/app/public;

    # Trust Traefik's forwarded headers
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # Mercure proxy (avoids mixed-content issues)
    location /.well-known/mercure {
        proxy_pass http://mercure/.well-known/mercure;
        proxy_read_timeout 24h;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    client_max_body_size 32M;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri /index.php$is_args$args;
        expires 1M;
        access_log off;
    }
}
